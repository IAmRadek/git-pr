# git-pr configuration
# `git-pr --init` writes this file to ~/.config/git-pr/config.yaml, or to the
# directory in --config or GIT_PR_CONFIG. If the file exists, it prints this
# sample and does not change the file.

# Jira links. If a ticket comes from a commit or PR title, the PR body links
# it as <url><ticket>. If this is not set, JIRA_URL is used.
# The `jira` ticket source suggests the tickets that `jql` finds. It reads the
# token from JIRA_TOKEN and, for Cloud, the account email from JIRA_USER.
jira:
  url: null # e.g. "https://company.atlassian.net/browse/"
  kind: cloud # or datacenter
  jql: "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC"

# The user whose open PRs git-pr links as related PRs. If this is not set,
# GITHUB_USER is used, then the user that `gh` is logged in as.
github:
  user: null

# The user whose open merge requests git-pr links as related PRs. If this is
# not set, the user that `glab` is logged in as is used.
gitlab:
  user: null

# The forge for each origin host. github.com and gitlab.com need no entry.
# The forge kinds are: github (uses `gh`), gitlab (uses `glab`).
#   git.example.com: github
#   gitlab.example.com: gitlab
forges: {}

# The plugins of each kind, in run order. A missing list uses the defaults.
# An empty list ([]) turns that kind off. The defaults are:
#   ticket_sources: [commit_tags]   # the first detected ticket wins
#   draft_hooks: [template_body]    # run before and after the editor
#   after_create: [related_prs]     # run after the PR step
# The available plugins are:
#   ticket_sources: commit_tags (the [TAG] in the commits),
#                   jira (suggests tickets, needs the jira section)
#   draft_hooks:    template_body (the PR body from the template)
#   after_create:   related_prs (the related-PR block in your open PRs)
plugins: {}

# The PR body. git-pr uses the first that exists: the repository template of
# the forge (for GitHub, .github/PULL_REQUEST_TEMPLATE.md; for GitLab,
# .gitlab/merge_request_templates/Default.md), then the file in
# `path`, then `body`. The markers enclose the related-PR block.
template:
  path: null
  body: |
    Related PRs:
    <!-- RELATED_PR -->
    <!-- /RELATED_PR -->

    ## Summary

    ## Changes

    ## Testing
  markers:
    related_pr_start: "<!-- RELATED_PR -->"
    related_pr_end: "<!-- /RELATED_PR -->"
